name: Build Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (draft releases only)
        required: true
        default: v0.2.1-beta

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - name: Validate and test
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(-[A-Za-z0-9.-]+)?$') { throw 'Invalid release tag' }
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Web tests failed' }
          dotnet run --project tests/pairing/PairingChecks.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Pairing tests failed' }
      - name: Package Windows companion
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Upload, verify and publish draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh release view $env:RELEASE_TAG --json isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or !$release.isDraft) { throw 'Only an existing draft release may be published by this workflow' }
          gh release upload $env:RELEASE_TAG release/PocketPad-Windows-x64.zip --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Upload failed' }
          $digest = 'sha256:' + (Get-FileHash release/PocketPad-Windows-x64.zip).Hash.ToLowerInvariant()
          $remote = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify uploaded asset' }
          $asset = $remote.assets | Where-Object name -eq 'PocketPad-Windows-x64.zip'
          if ($asset.digest -ne $digest) { throw 'Release checksum mismatch' }
          gh release edit $env:RELEASE_TAG --draft=false --prerelease --notes-file RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Publishing failed' }
          "Verified Windows download: $($asset.browser_download_url)" >> $env:GITHUB_STEP_SUMMARY
          "SHA256: $digest" >> $env:GITHUB_STEP_SUMMARY
